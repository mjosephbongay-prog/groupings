<!DOCTYPE html>
<html>
    <head>
        <TITLE>ESCAFE</TITLE>
    </head>
    <body>
        <style>
            body {
                text-align: center;
                background-image: url("Image/backg2.jpg");
                background-size: cover;
            }
        </style>
<div class="col-lg-6">
                        <div class="text-center p-5" style="background: rgba(51, 33, 29, .8);">
                            <h1 class="text-white mb-4 mt-5">Book Your Table</h1>
                            <form class="mb-5">
                                <div class="form-group">
                                    <input type="text" class="form-control bg-transparent border-primary p-4" placeholder="Name"
                                        required="required" /><input type="submit"/>
                                </div>
                                <div class="form-group">
                                    <input type="email" class="form-control bg-transparent border-primary p-4" placeholder="Email"
                                        required="required" /><input type="submit"/>
                                </div>
                                <div class="form-group">
                                    <div class="date" id="date" data-target-input="nearest">
                                        <input type="text" class="form-control bg-transparent border-primary p-4 datetimepicker-input" placeholder="Date" data-target="#date" data-toggle="datetimepicker"/>
                                        <input type="submit"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="time" id="time" data-target-input="nearest">
                                        <input type="text" class="form-control bg-transparent border-primary p-4 datetimepicker-input" placeholder="Time" data-target="#time" data-toggle="datetimepicker"/><input type="submit"/>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <select class="custom-select bg-transparent border-primary px-8" style="height: 65px;">
                                        <option selected>Ice Coffee</option>
                                        <option value="1">Ice Latte</option>
                                        <option value="2">Caramel Iced Coffee</option>
                                        <option value="3">Ice Mocha</option>
                                        <option value="4">Vanilla Iced Coffee</option>
                                        <option value="5">Chocolate Iced Coffee</option>
                                        
                                        </select>

                                    </div>
                                    <select class="custom-select bg-transparent border-primary px-8" style="height: 65px;">
                                        <option selected>Hot Coffee</option>
                                        <option value="1">Espresso</option>
                                        <option value="2">Cappuccino</option>
                                        <option value="3">Mocha</option>
                                        <option value="4">Americano</option>

                                        </select>
                                        <select class="custom-select bg-transparent border-primary px-8" style="height: 65px;">
                                        <option selected>Milkea</option>
                                        <option value="1">Matcha</option>
                                        <option value="2">Strawberry</option>
                                        <option value="3">WinterMelon</option>
                                        <option value="4">Mango</option>
                                        <option value="5">Melon</option>
                                        <option value="6">Chocolate</option>
                                        <option value="7">Rocky Road</option>
                                        </select>

                                    </div>







                                    


                                    </div>







                                    








                                    

             

    </body>





</html>
